<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>uniScale</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <h1>uniScale</h1>
    </div>
    <p id="summary">오브젝트는 하나입니다. 손만 쓰는 모드에서는 시선이 맞은 것으로 두고, 얼굴 레이 모드에서는 코끝에서 나간 선이 오브젝트를 맞출 때만 크기가 바뀝니다.</p>
  </header>
  <main>
    <section class="stage" id="stage">
      <video id="video" playsinline autoplay muted></video>
      <canvas id="canvas" width="960" height="540"></canvas>
      <button id="start" class="start" type="button">카메라 시작</button>
    </section>
    <aside>
      <section>
        <h2>조준</h2>
        <div class="aim">
          <button id="aim-hand" class="active" type="button">손만</button>
          <button id="aim-ray" type="button">얼굴 레이</button>
        </div>
        <p id="aim-note"></p>
      </section>
      <section>
        <h2>스케일 방식</h2>
        <div class="modes" id="modes"></div>
      </section>
      <section>
        <h2>설정</h2>
        <div class="settings">
          <button id="clutch" type="button">Clutching</button>
          <button id="hand" type="button">우세손 오른손</button>
          <button id="palm" type="button">손바닥 반전</button>
          <button id="reset" type="button">크기 리셋</button>
          <button id="stop" type="button">종료</button>
        </div>
      </section>
      <section>
        <h2>상태</h2>
        <div id="verdict" class="verdict bad">카메라 꺼짐</div>
        <ul id="checks"></ul>
        <p id="detail"></p>
      </section>
      <section>
        <h2>이 제스처</h2>
        <p id="help"></p>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
